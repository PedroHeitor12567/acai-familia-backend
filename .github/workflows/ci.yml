name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+pysqlite:///:memory:
      SECRET_KEY: chave-de-ci-com-mais-de-trinta-e-dois-caracteres
      TEST_DATABASE_URL: postgresql+psycopg://acai:acai@localhost:5432/acai
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acai
          POSTGRES_PASSWORD: acai
          POSTGRES_DB: acai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - name: Aplica as migrations no PostgreSQL
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Verifica se os models batem com as migrations
        run: alembic check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pytest -q
      - run: bandit -c pyproject.toml -r app -q
      - run: pip-audit
