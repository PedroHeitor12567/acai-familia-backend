services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acai
      POSTGRES_PASSWORD: acai
      POSTGRES_DB: acai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acai"]
      interval: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://acai:acai@db:5432/acai
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
volumes:
  pgdata:
