[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acai-familia-backend"
version = "0.1.0"
description = "Backend do sistema de gestão Açaí Família"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "taskipy>=1.14.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.taskipy.tasks]
run = { cmd = "uvicorn app.main:app --reload", help = "API em modo desenvolvimento (http://localhost:8000/docs)" }
test = { cmd = "pytest -q", help = "testes" }
lint = { cmd = "ruff check . && ruff format --check .", help = "ruff (lint + formatação)" }
fmt = { cmd = "ruff check --fix . && ruff format .", help = "corrige lint e formata" }
types = { cmd = "mypy app", help = "mypy strict" }
sec = { cmd = "bandit -c pyproject.toml -r app -q && pip-audit", help = "bandit + pip-audit" }
check = { cmd = "task lint && task types && task test && task sec", help = "tudo que o CI roda" }
db = { cmd = "docker compose up -d db", help = "sobe só o PostgreSQL" }
migrate = { cmd = "alembic upgrade head", help = "aplica migrations" }
migration = { cmd = "alembic revision --autogenerate -m", help = "nova migration: task migration \"mensagem\"" }
admin = { cmd = "python -m scripts.create_admin", help = "cria o primeiro administrador" }
